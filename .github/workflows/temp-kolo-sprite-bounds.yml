name: Temporary Kolo sprite bounds

on:
  push:
    branches:
      - art/meteora-level-01-assets
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python3 -m pip install --disable-pip-version-check pillow
      - name: Measure Kolo alpha occupancy
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from PIL import Image

          specs = [
              (
                  Path("Assets/Art/Meteora/Characters/Kolo/kolo-normal-sheet.png"),
                  ["idle", "rolling", "jump", "landing-squash", "surprised"],
              ),
              (
                  Path("Assets/Art/Meteora/Characters/Kolo/kolo-heavy-sheet.png"),
                  ["heavy-idle", "heavy-rolling", "heavy-jump", "heavy-landing-squash"],
              ),
          ]

          report = []
          for path, names in specs:
              data = path.read_bytes()
              image = Image.open(path).convert("RGBA")
              width, height = image.size
              alpha = image.getchannel("A")
              pixels = alpha.load()
              count = len(names)
              boundaries = [i * width // count for i in range(count + 1)]
              poses = []
              for index, name in enumerate(names):
                  cell_x0, cell_x1 = boundaries[index], boundaries[index + 1]
                  xs, ys = [], []
                  for y in range(height):
                      for x in range(cell_x0, cell_x1):
                          if pixels[x, y] > 0:
                              xs.append(x)
                              ys.append(y)
                  if not xs:
                      raise SystemExit(f"empty pose cell: {path} {name}")
                  bbox = [min(xs), min(ys), max(xs) + 1, max(ys) + 1]
                  source = [
                      max(cell_x0, bbox[0] - 12),
                      max(0, bbox[1] - 12),
                      min(cell_x1, bbox[2] + 12),
                      min(height, bbox[3] + 12),
                  ]
                  unity = [
                      source[0],
                      height - source[3],
                      source[2] - source[0],
                      source[3] - source[1],
                  ]
                  poses.append({
                      "index": index,
                      "name": name,
                      "cell_x": [cell_x0, cell_x1],
                      "alpha_bbox": bbox,
                      "alpha_pixels": len(xs),
                      "guards": {
                          "left": bbox[0] - cell_x0,
                          "right": cell_x1 - bbox[2],
                          "top": bbox[1],
                          "bottom": height - bbox[3],
                      },
                      "touches_cell_edge": bbox[0] == cell_x0 or bbox[2] == cell_x1,
                      "source_padded_half_open": source,
                      "unity_rect": unity,
                  })
              report.append({
                  "path": str(path),
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "size": [width, height],
                  "mode": image.mode,
                  "cell_boundaries": boundaries,
                  "poses": poses,
              })
          print("KOLO_BOUNDS_JSON=" + json.dumps(report, separators=(",", ":")))
          PY
