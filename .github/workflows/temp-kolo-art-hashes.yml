name: Temporary Kolo art hashes

on:
  push:
    branches:
      - art/meteora-level-01-assets

permissions:
  contents: read

jobs:
  hashes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sha256sum Assets/Art/Meteora/Characters/Kolo/kolo-normal-sheet.png Assets/Art/Meteora/Characters/Kolo/kolo-heavy-sheet.png
